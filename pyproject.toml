[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oasse-memory-muscle"
version = "0.1.0"
description = "Governed compounding-memory coding agent for the AWS Data & AI Hackathon"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Oak & Sparrow Systems Enterprise LLC"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
